# Stack completo del parte semanal: aplicación Next.js + PostgreSQL 16.
#
# Coolify: crea un único recurso "Docker Compose" sobre este archivo y levanta
# app y base de datos juntas. El dominio se configura una vez en la UI de ese
# recurso (o con la variable SERVICE_FQDN_APP_3000) y el proxy enruta al 3000.
#
# Local: `docker compose up -d db` levanta solo la base de datos para `npm run
# dev`. Con `docker compose up --build` se prueba la imagen de producción.
#
# Este archivo es el que despliega Coolify, así que debe valer tal cual en el
# servidor: el `db` no publica puertos del host (en un VPS el 5432 suele estar
# ocupado por el Postgres del propio Coolify). El puerto para `npm run dev`
# vive en `compose.override.yml`, que Compose carga solo en local y Coolify
# ignora porque invoca `-f compose.yml`.

name: parte-diario

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parte_diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parte_diario}
      POSTGRES_DB: ${POSTGRES_DB:-parte_diario}
      TZ: ${TZ:-Europe/Madrid}
      PGTZ: ${TZ:-Europe/Madrid}
    volumes:
      - parte_diario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Sin `ports`: en producción solo se llega al `db` por la red interna del
    # stack (`db:5432`). Para publicarlo en local, `compose.override.yml`.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parte_diario}:${POSTGRES_PASSWORD:-parte_diario}@db:5432/${POSTGRES_DB:-parte_diario}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      ACCESO_RAPIDO_DEMO: ${ACCESO_RAPIDO_DEMO:-false}
      # Opcionales: sin CRON_SECRET el cron de avisos responde 503 y sin
      # SMTP_URL los correos quedan SIN_PROVEEDOR. La app arranca igual.
      CRON_SECRET: ${CRON_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
    expose:
      - '3000'
    # El healthcheck viene del Dockerfile (`/api/health`). Coolify lo usa para
    # no enrutar tráfico hasta que la app responde y para revertir si falla.

volumes:
  parte_diario_pgdata:
