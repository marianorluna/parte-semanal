# Stack completo del parte semanal: aplicación Next.js + PostgreSQL 16.
#
# Coolify: crea un único recurso "Docker Compose" sobre este archivo y levanta
# app y base de datos juntas. El dominio se configura una vez en la UI de ese
# recurso (o con la variable SERVICE_FQDN_APP_3000) y el proxy enruta al 3000.
#
# Local: `docker compose up -d db` levanta solo la base de datos para `npm run
# dev`. Con `docker compose up --build` se prueba la imagen de producción.

name: parte-diario

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parte_diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parte_diario}
      POSTGRES_DB: ${POSTGRES_DB:-parte_diario}
      TZ: ${TZ:-Europe/Madrid}
      PGTZ: ${TZ:-Europe/Madrid}
    volumes:
      - parte_diario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Escucha solo en el loopback del host: permite `npm run dev` y un cliente
    # SQL local sin exponer Postgres a Internet. En Coolify no se necesita.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parte_diario}:${POSTGRES_PASSWORD:-parte_diario}@db:5432/${POSTGRES_DB:-parte_diario}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      TZ: ${TZ:-Europe/Madrid}
      NODE_ENV: production
    expose:
      - '3000'
    # El healthcheck viene del Dockerfile (`/api/health`). Coolify lo usa para
    # no enrutar tráfico hasta que la app responde y para revertir si falla.

volumes:
  parte_diario_pgdata:
