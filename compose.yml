services:
  db:
    image: postgres:16-alpine
    container_name: parte-diario-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parte_diario
      POSTGRES_PASSWORD: parte_diario
      POSTGRES_DB: parte_diario
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    ports:
      - '5432:5432'
    volumes:
      - parte_diario_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parte_diario -d parte_diario']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parte_diario_pgdata:
